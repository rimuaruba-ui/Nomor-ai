<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Manga Panel Border Grid Effect -->
  <rect x="56" y="56" width="400" height="400" rx="64" fill="none" stroke="#6366f1" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="8 8" />
  
  <!-- Outer Glow for Center Emblem -->
  <g filter="url(#glow)">
    <!-- Stylized Modern Bold 'N' for NIMO AI -->
    <path d="M144 368 V144 L256 312 V144 H304 V368 L192 200 V368 Z" fill="url(#primaryGrad)" />
  </g>

  <!-- Panel Cutter / Sparkle Overlay -->
  <path d="M360 130 L370 155 L395 165 L370 175 L360 200 L350 175 L325 165 L350 155 Z" fill="url(#accentGrad)" />
  <path d="M120 340 L126 355 L141 361 L126 367 L120 382 L114 367 L99 361 L114 355 Z" fill="#34d399" opacity="0.8" />
  
  <!-- Mini Panel Scissors / AI Pen Accent -->
  <circle cx="368" cy="368" r="28" fill="#1e1b4b" stroke="#6366f1" stroke-width="4" />
  <path d="M358 358 L378 378 M378 358 L358 378" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
</svg>
