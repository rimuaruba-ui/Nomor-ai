<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base rounded rectangle with safe zone consideration -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3" />

  <!-- Manga / Comic Panels Mosaic in Safe Zone -->
  <g transform="translate(256, 256)">
    <!-- Top Left Panel -->
    <rect x="-140" y="-140" width="130" height="110" rx="16" fill="rgba(255, 255, 255, 0.07)" stroke="#6366f1" stroke-width="3" stroke-dasharray="4 2" />
    
    <!-- Top Right Panel -->
    <rect x="10" y="-140" width="130" height="85" rx="16" fill="rgba(99, 102, 241, 0.15)" stroke="url(#glowGrad)" stroke-width="4" />
    
    <!-- Bottom Right Panel -->
    <rect x="10" y="-35" width="130" height="175" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="3" />
    
    <!-- Bottom Left Panel -->
    <rect x="-140" y="-10" width="130" height="150" rx="16" fill="rgba(236, 72, 153, 0.12)" stroke="url(#primaryGrad)" stroke-width="3.5" />

    <!-- Stylized "N" Letterform + Scissors / Dynamic Slice Blade Cut -->
    <!-- Blade energy slash -->
    <path d="M-150 -60 L150 60" stroke="#00f2ff" stroke-width="6" stroke-linecap="round" filter="url(#neonGlow)" />
    
    <!-- Distinctive Center Emblem 'N' for Nimo -->
    <path d="M-55 70 L-55 -70 L55 70 L55 -70" fill="none" stroke="url(#primaryGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M-55 70 L-55 -70 L55 70 L55 -70" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

    <!-- AI Sparkle Star top right -->
    <path d="M100 -100 Q100 -80 120 -80 Q100 -80 100 -60 Q100 -80 80 -80 Q100 -80 100 -100 Z" fill="#00f2ff" filter="url(#neonGlow)" />
    
    <!-- Small accent sparkle -->
    <circle cx="-100" cy="90" r="5" fill="#ec4899" />
  </g>
</svg>
